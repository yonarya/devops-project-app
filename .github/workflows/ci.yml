name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f api/Containerfile -t ticketing-api:ci api

      - name: Build frontend image
        run: docker build -f frontend/Containerfile -t ticketing-frontend:ci frontend

      - name: Build worker image
        run: docker build -f worker/Containerfile -t ticketing-worker:ci worker

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticketing-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticketing-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticketing-worker:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0