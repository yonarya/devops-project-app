name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f api/Containerfile -t ticketing-api:ci api

      - name: Build frontend image
        run: docker build -f frontend/Containerfile -t ticketing-frontend:ci frontend

      - name: Build worker image
        run: docker build -f worker/Containerfile -t ticketing-worker:ci worker